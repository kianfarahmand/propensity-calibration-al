name: tests

# The fast job is the contract: the pre-registered validity tests must pass on a
# clean ubuntu-latest machine built from environment.yml alone. Those pins were
# solved on win-64, so this job is also the first real test of whether they
# resolve on linux-64 - which is why build strings were deliberately omitted
# from environment.yml.
#
# The smoke job is not a scientific result. It exists to prove the machinery
# runs end to end and to measure wall-clock per step, so shard sizing for the
# evaluation grid comes from a measurement.

# The "report the failure" steps exist because this project is driven through
# the GitHub API: job logs are served from blob storage that the driving agent
# cannot reach, so a failure that only appears in the log is invisible. Posting
# the captured output as a commit comment puts it behind api.github.com, where
# it can be read. Lint uses GitHub annotation format for the same reason.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'results/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.14.0
      - run: ruff check --output-format=github src tests scripts

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: pcal
          miniforge-version: latest
          auto-activate-base: false

      - name: Record the solved environment
        run: |
          conda list
          python -c "import numpy, scipy, sklearn, matminer, pymatgen; print(numpy.__version__, scipy.__version__, sklearn.__version__)"

      - name: Install the package
        run: pip install -e . --no-deps --no-build-isolation

      - name: Validity tests (no network)
        run: |
          set -o pipefail
          pytest -m "not slow" -v 2>&1 | tee ci-output.txt

      - name: Report the failure through the API
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ${{ github.workflow }} / ${{ github.job }} failed"
            echo ""
            echo '```'
            tail -c 50000 ci-output.txt 2>/dev/null || echo "no captured output"
            echo '```'
          } > ci-comment.md
          gh api --method POST \
            "/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@ci-comment.md

  smoke:
    # One dataset, two seeds, twenty steps. No scientific result is produced
    # here and none may be reported from it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: pcal
          miniforge-version: latest
          auto-activate-base: false

      - run: pip install -e . --no-deps --no-build-isolation

      - name: Cache the featurized pool
        uses: actions/cache@v4
        with:
          path: .cache/pcal
          key: magpie-${{ hashFiles('configs/datasets.yaml') }}

      - name: Pool construction on real data
        run: |
          set -o pipefail
          pcal pool --dataset matbench_steels 2>&1 | tee ci-output.txt

      - name: Real-data validity checks
        run: |
          set -o pipefail
          pytest -m slow -v 2>&1 | tee -a ci-output.txt

      - name: Smoke campaign
        run: |
          set -o pipefail
          pcal run --config configs/smoke.yaml 2>&1 | tee -a ci-output.txt

      - name: Report the failure through the API
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ${{ github.workflow }} / ${{ github.job }} failed"
            echo ""
            echo '```'
            tail -c 50000 ci-output.txt 2>/dev/null || echo "no captured output"
            echo '```'
          } > ci-comment.md
          gh api --method POST \
            "/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@ci-comment.md

      - name: Merge
        run: python scripts/merge_results.py results/raw/smoke results/processed/smoke.csv


      - name: Report the smoke measurement through the API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### smoke measurement"
            echo ""
            echo "No scientific result. One tuning dataset, two seeds, twenty steps."
            echo ""
            echo '```'
            tail -n 12 ci-output.txt
            echo '```'
            echo ""
            echo '```csv'
            cat results/processed/smoke.csv
            echo '```'
          } > ci-summary.md
          gh api --method POST \
            "/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@ci-summary.md

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            results/raw/smoke/
            results/processed/
          retention-days: 14
