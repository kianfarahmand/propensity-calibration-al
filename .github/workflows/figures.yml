name: figures

# Regenerate every result table and figure the manuscript cites, from the
# committed per-run and per-step tables. Manual dispatch only.
#
# S08 wired this up: scripts/make_figures.py is the single entry point and this
# workflow is the proof that the figure set regenerates from a clean checkout
# with nothing but the repository. The job commits what it produced and posts
# the run's output as a commit comment, because job logs and build artifacts
# are served from blob storage an API-driven agent cannot reach - a result that
# exists only in the log is invisible to whoever dispatched the run.
#
# Merging raw shards into a new table is still available here (give a label and
# optionally a run id) but is not the point of the workflow any more: that is
# what the collect job of experiments.yml does at the end of a dispatch.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: workflow run id to pull raw artifacts from (blank = skip the merge)
        required: false
        default: ""
      label:
        description: name for the merged tables (blank = merge nothing, just regenerate)
        required: false
        default: ""
      resamples:
        description: bootstrap resamples (10000 is the manuscript setting; lower is a smoke pass)
        required: false
        default: "10000"
      commit:
        description: commit the regenerated tables and figures ("true" or "false")
        required: false
        default: "true"

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: pcal
          miniforge-version: latest
          auto-activate-base: false

      - run: pip install -e . --no-deps --no-build-isolation

      - name: Download raw records from a previous run
        if: inputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: raw-*
          merge-multiple: true
          path: results/raw/

      - name: Merge raw shards
        if: inputs.label != ''
        run: |
          python scripts/merge_results.py \
            results/raw/${{ inputs.label }} \
            results/processed/${{ inputs.label }}.csv
          gzip -nf results/processed/${{ inputs.label }}_steps.csv

      - name: Regenerate every table and figure
        id: regen
        continue-on-error: true
        env:
          RESAMPLES: ${{ inputs.resamples }}
        run: |
          set -o pipefail
          python scripts/make_figures.py --resamples "${RESAMPLES}" 2>&1 \
            | tee figures-output.txt

      - name: Report the run through the API
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESAMPLES: ${{ inputs.resamples }}
        run: |
          {
            echo "### figures / make_figures.py (run ${{ github.run_id }}, resamples ${RESAMPLES})"
            echo ""
            echo '```'
            tail -c 50000 figures-output.txt 2>/dev/null || echo "no captured output"
            echo '```'
            echo ""
            echo "working tree after the run:"
            echo '```'
            git status --porcelain | head -40
            ls -l results/figures/ 2>/dev/null | head -20
            echo '```'
          } > ci-comment.md
          gh api --method POST \
            "/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@ci-comment.md

      - name: Commit the regenerated tables and figures
        if: ${{ inputs.commit == 'true' && steps.regen.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/processed results/figures
          if git diff --cached --quiet; then
            echo "nothing to commit - every output was already committed and identical"
          else
            git commit -m "results: regenerated by scripts/make_figures.py (run ${{ github.run_id }})"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((RANDOM % 20 + 5))
            done
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: figures-${{ github.run_id }}
          path: |
            results/processed/
            results/figures/
            figures-output.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Fail the job if the regeneration failed
        if: ${{ steps.regen.outcome != 'success' }}
        run: exit 1
