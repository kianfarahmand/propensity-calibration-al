[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcal"
version = "0.1.0"
description = "Propensity-corrected calibration monitoring for pool-based active materials discovery"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kian Farahmand" }]
keywords = [
    "active learning",
    "Bayesian optimization",
    "calibration",
    "inverse propensity weighting",
    "materials informatics",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
materials = ["matminer>=0.9.2", "pymatgen>=2024.1.1"]
dev = ["pytest>=7.4", "pytest-xdist>=3.5", "ruff>=0.4"]

[project.scripts]
pcal = "pcal.cli:main"

[project.urls]
Repository = "https://github.com/kianfarahmand/propensity-calibration-al"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: excluded from the default CI test job"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
